<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>💰 Personal Budget Tracker</h1>
      <p>Keep track of your daily expenses and monitor your budget.</p>
    </header>

    <!-- Budget Overview Cards -->
    <div class="overview">
      <div class="card">
        <h3>Total Spent</h3>
        <p id="total-spent">$0.00</p>
      </div>
      <div class="card">
        <h3>Budget Limit</h3>
        <p id="budget-limit">$500.00</p>
      </div>
      <div class="card">
        <h3>Remaining</h3>
        <p id="budget-remaining">$500.00</p>
      </div>
    </div>

    <!-- Expense Entry Form -->
    <form id="expense-form">
      <div class="form-group">
        <label for="desc">Description</label>
        <input type="text" id="desc" placeholder="e.g., Domain Name, Coffee, Book" required>
      </div>
      <div class="form-group">
        <label for="amount">Amount ($)</label>
        <input type="number" id="amount" step="0.01" placeholder="15.00" required>
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category">
          <option value="Learning">Learning & Dev</option>
          <option value="Software">Software & Tools</option>
          <option value="Food">Food & Drinks</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <button type="submit" class="btn">Add Expense</button>
    </form>

    <!-- Expense List Table -->
    <section class="history">
      <h2>Expense History</h2>
      <ul id="expense-list"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
